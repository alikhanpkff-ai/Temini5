<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite AI Builder - Autonomous Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex overflow-hidden font-sans">

    <!-- LEFT: File Tree Panel -->
    <div class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col">
        <div class="p-4 border-b border-gray-800">
            <h3 class="font-bold text-gray-400 uppercase text-xs tracking-wider">Workspace Files</h3>
        </div>
        <ul id="fileTree" class="p-2 space-y-1 text-sm text-gray-300 flex-1 overflow-y-auto">
            <!-- Dynamically populated files appear here -->
        </ul>
    </div>

    <!-- CENTER: Real-Time Preview Panel -->
    <div class="flex-1 flex flex-col bg-white">
        <div class="bg-gray-800 p-3 text-xs text-gray-400 flex items-center justify-between shadow-md z-10">
            <span class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                Live Preview Canvas
            </span>
            <button onclick="renderLivePreview()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-white transition-colors">Force Refresh</button>
        </div>
        <!-- The live preview window -->
        <iframe id="previewCanvas" class="w-full flex-1 border-none bg-gray-50"></iframe>
    </div>

    <!-- RIGHT: AI Controller & Auto-Build Panel -->
    <div class="w-96 bg-gray-950 border-l border-gray-800 flex flex-col">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center">
            <h3 class="font-bold text-sm text-blue-400">AI Architect Console</h3>
            <!-- AUTO BUILD TOGGLE -->
            <button id="autoBuildBtn" onclick="toggleAutoBuild()" class="bg-red-900/50 text-red-400 border border-red-700 hover:bg-red-800 hover:text-white text-xs px-3 py-1 rounded-full transition-all font-bold tracking-wide">
                Auto-Build: OFF
            </button>
        </div>
        
        <div class="p-4 flex-1 flex flex-col gap-2">
            <label class="text-xs text-gray-500 uppercase tracking-wider">Current File Inspector</label>
            <textarea id="codeInspector" class="w-full flex-1 bg-gray-900 text-green-400 p-3 font-mono text-xs rounded border border-gray-700 focus:outline-none focus:border-blue-500 transition-colors resize-none shadow-inner" readonly></textarea>
        </div>
        
        <div class="p-4 bg-gray-900 border-t border-gray-800">
            <label class="text-xs text-gray-500 uppercase tracking-wider mb-2 block">Next Command</label>
            <input id="aiPrompt" type="text" placeholder="e.g., Add a dark mode toggle..." class="w-full bg-gray-950 text-white p-3 text-sm rounded border border-gray-700 focus:outline-none focus:border-blue-500 shadow-inner mb-3">
            
            <button id="manualTriggerBtn" onclick="triggerAiGeneration()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 p-3 rounded text-sm font-semibold tracking-wide hover:opacity-90 shadow-lg transition-opacity flex justify-center items-center gap-2">
                Inject Component
            </button>
        </div>
    </div>

    <script>
        // 1. Core State
        let isAutoBuildActive = false;
        let isGenerating = false;
        
        let virtualFileSystem = {
            "index.html": "<!DOCTYPE html><html><head><script src='https://cdn.tailwindcss.com'><\/script></head><body class='bg-gray-100 min-h-screen'><div id='header-target'></div><main id='main-target' class='p-8 text-center'><h1 class='text-4xl font-bold text-gray-800 mb-4'>Waiting for AI...</h1><p class='text-gray-500'>Give the AI a prompt to start building.</p></main><div id='footer-target'></div><script src='app.js'><\/script></body></html>",
            "app.js": "console.log('App Initialized');"
        };

        // 2. UI Updates
        function updateFileTreeUI() {
            const treeEl = document.getElementById('fileTree');
            treeEl.innerHTML = '';
            Object.keys(virtualFileSystem).forEach(filename => {
                let li = document.createElement('li');
                li.className = "cursor-pointer text-gray-400 hover:text-white p-2 rounded hover:bg-gray-800 flex items-center transition-colors";
                li.innerHTML = `📄 <span class="ml-2 truncate">${filename}</span>`;
                li.onclick = () => {
                    document.getElementById('codeInspector').value = virtualFileSystem[filename];
                };
                treeEl.appendChild(li);
            });
        }

        // 3. The Compiler
        function renderLivePreview() {
            const iframe = document.getElementById('previewCanvas');
            let compiledHTML = virtualFileSystem["index.html"];
            
            // Inject components dynamically if they exist
            if(virtualFileSystem["components/Header.html"]) compiledHTML = compiledHTML.replace("<div id='header-target'></div>", virtualFileSystem["components/Header.html"]);
            if(virtualFileSystem["components/Hero.html"]) compiledHTML = compiledHTML.replace("<main id='main-target'", "<main style='display:none;' id='hidden-target'").replace("</main>", "</main>" + virtualFileSystem["components/Hero.html"]);
            if(virtualFileSystem["components/Footer.html"]) compiledHTML = compiledHTML.replace("<div id='footer-target'></div>", virtualFileSystem["components/Footer.html"]);
            
            // Inject JS
            compiledHTML = compiledHTML.replace("<script src='app.js'><\/script>", `<script>${virtualFileSystem["app.js"]}<\/script>`);

            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(compiledHTML);
            doc.close();
        }

        // 4. Autonomous Controls
        function toggleAutoBuild() {
            const btn = document.getElementById('autoBuildBtn');
            isAutoBuildActive = !isAutoBuildActive;
            
            if (isAutoBuildActive) {
                btn.className = "bg-green-900/50 text-green-400 border border-green-500 hover:bg-green-800 hover:text-white text-xs px-3 py-1 rounded-full transition-all font-bold tracking-wide animate-pulse";
                btn.innerText = "Auto-Build: ON";
                
                // If the user hasn't typed anything, kick it off with a default command
                if (!document.getElementById('aiPrompt').value) {
                    document.getElementById('aiPrompt').value = "Initialize core layout with a modern navbar and hero section.";
                }
                triggerAiGeneration();
            } else {
                btn.className = "bg-red-900/50 text-red-400 border border-red-700 hover:bg-red-800 hover:text-white text-xs px-3 py-1 rounded-full transition-all font-bold tracking-wide";
                btn.innerText = "Auto-Build: OFF";
            }
        }

        // 5. AI Interaction Engine
        async function triggerAiGeneration() {
            if (isGenerating) return;
            
            const promptInput = document.getElementById('aiPrompt');
            const promptText = promptInput.value;
            if (!promptText) return;

            isGenerating = true;
            document.getElementById('manualTriggerBtn').innerText = "Generating...";
            document.getElementById('manualTriggerBtn').classList.add('opacity-50', 'cursor-not-allowed');

            // ====================================================================
            // ⚠️ REPLACE THIS BLOCK WITH YOUR ACTUAL GEMINI API FETCH REQUEST ⚠️
            // ====================================================================
            
            // Simulating network delay and API response for demonstration
            const mockApiResponse = await simulateBackendApiCall(promptText);
            
            // ====================================================================

            handleAiResponseChunk(mockApiResponse);
            
            isGenerating = false;
            document.getElementById('manualTriggerBtn').innerText = "Inject Component";
            document.getElementById('manualTriggerBtn').classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function handleAiResponseChunk(jsonStringResponse) {
            try {
                const updateData = JSON.parse(jsonStringResponse);
                
                // Write to virtual file system
                virtualFileSystem[updateData.target_file] = updateData.code;
                
                // Update UI instantly
                document.getElementById('codeInspector').value = updateData.code;
                document.getElementById('aiPrompt').value = ""; // Clear input
                updateFileTreeUI();
                renderLivePreview();
                
                // AUTONOMOUS LOOP TRIGGER
                if (isAutoBuildActive && updateData.next_recommended_step) {
                    document.getElementById('aiPrompt').value = updateData.next_recommended_step;
                    console.log(`Auto-Build queueing next step: ${updateData.next_recommended_step}`);
                    
                    // Wait 2 seconds so the user can see the change, then fire again
                    setTimeout(() => {
                        if (isAutoBuildActive) triggerAiGeneration();
                    }, 2000);
                }
                
            } catch (e) {
                console.error("Failed to parse clean component JSON data: ", e);
                // If it fails, stop auto-build to prevent infinite error loops
                if (isAutoBuildActive) toggleAutoBuild();
            }
        }

        // --- Mock API Function just to prove the auto-loop works out of the box ---
        function simulateBackendApiCall(prompt) {
            return new Promise(resolve => {
                setTimeout(() => {
                    let mockResponse = {};
                    
                    if (prompt.includes("layout") || prompt.includes("navbar")) {
                        mockResponse = {
                            target_file: "components/Header.html",
                            action: "CREATE",
                            code: "<nav class='bg-indigo-600 p-4 shadow-lg text-white flex justify-between items-center'><div class='font-bold text-xl tracking-tight'>AI App</div><div class='flex gap-4'><a href='#' class='hover:text-indigo-200'>Home</a><a href='#' class='hover:text-indigo-200'>Features</a></div></nav>",
                            next_recommended_step: "Now I will build a visually striking Hero component to capture user attention."
                        };
                    } else if (prompt.includes("Hero")) {
                        mockResponse = {
                            target_file: "components/Hero.html",
                            action: "CREATE",
                            code: "<div class='bg-gradient-to-br from-indigo-900 to-purple-900 py-20 px-8 text-center text-white'><h1 class='text-5xl font-extrabold mb-6'>Built entirely by AI.</h1><p class='text-xl text-indigo-200 mb-8 max-w-2xl mx-auto'>This platform is continuously self-improving through an autonomous loop.</p><button class='bg-white text-indigo-900 px-8 py-3 rounded-full font-bold shadow-xl hover:scale-105 transition-transform'>Get Started</button></div>",
                            next_recommended_step: "Next, I will add a Footer component to complete the page structure."
                        };
                    } else {
                        mockResponse = {
                            target_file: "components/Footer.html",
                            action: "CREATE",
                            code: "<footer class='bg-gray-950 p-6 text-center text-gray-500 text-sm mt-auto w-full'>&copy; 2026 AI Autonomous Builder. All rights reserved.</footer>",
                            next_recommended_step: "The base layout is complete. Let's add some JavaScript logic to animate the Hero section."
                        };
                    }
                    resolve(JSON.stringify(mockResponse));
                }, 1500); // 1.5 second simulated API delay
            });
        }

        // Initialize UI on load
        updateFileTreeUI();
        renderLivePreview();
        document.getElementById('codeInspector').value = virtualFileSystem["index.html"];
    </script>
</body>
</html>
