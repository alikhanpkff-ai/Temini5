<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini 5-Stage Assembly Line</title>

  <!-- External Libraries for Markdown and Code Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background: var(--bg-color); 
      color: var(--text); 
      display: flex; 
      flex-direction: column; 
      height: 100vh;
      overflow: hidden;
    }
    
    header { text-align: center; padding: 16px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid var(--border); z-index: 10; }
    header h1 { font-size: 1.4rem; color: var(--accent); }
    header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    #main-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 24px;
      scroll-behavior: smooth;
    }

    details { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; padding: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    summary { font-weight: bold; font-size: 0.95rem; cursor: pointer; color: var(--accent); user-select: none; }
    
    .key-group { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .key-input-box { display: flex; flex-direction: column; gap: 6px; }
    .key-input-box label { font-size: 0.8rem; color: var(--text-muted); }
    
    input, textarea {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }

    .fill-btn { background: var(--border); color: var(--text); border: none; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; margin-top: 8px; cursor: pointer; transition: background 0.2s; width: 100%; }
    .fill-btn:hover { background: #475569; }

    #chat-container { display: flex; flex-direction: column; gap: 16px; }
    
    .msg-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      animation: fadeIn 0.3s ease-in;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .msg-card h4 { color: var(--accent); margin-bottom: 12px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .msg-card.final { border: 2px solid var(--accent); background: rgba(14, 165, 233, 0.1); }
    .msg-card.error { border: 2px solid var(--error); }

    /* Markdown Styles */
    .markdown-body { font-size: 0.95rem; line-height: 1.6; word-break: break-word; }
    .markdown-body p { margin-bottom: 12px; }
    .markdown-body pre { background: #0b1120; padding: 12px; border-radius: 8px; overflow-x: auto; margin-bottom: 12px; border: 1px solid var(--border); }
    .markdown-body code { font-family: "Fira Code", monospace; font-size: 0.85rem; }
    .markdown-body ul, .markdown-body ol { margin-left: 20px; margin-bottom: 12px; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: 16px 0 8px 0; color: #fff; }

    .copy-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn.copied { background: var(--success); color: #fff; }

    .input-bar {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      align-items: flex-end;
      z-index: 10;
    }

    .input-bar textarea { height: 50px; min-height: 50px; max-height: 150px; resize: vertical; margin: 0; }
    .send-btn { background: var(--accent); color: #0f172a; border: none; font-weight: bold; padding: 0 20px; height: 50px; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: var(--accent); animation: spin 1s ease-in-out infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>⚡ 5-Gemini Pipeline</h1>
    <p>Sequential Multi-Agent Refinement</p>
  </header>

  <div id="main-scroll-area">
    <details id="settings-panel" open>
      <summary>⚙️ Configure 5 Gemini Keys & Agents</summary>
      <button class="fill-btn" id="duplicateBtn" type="button">📋 Duplicate Key #1 to all 5 slots</button>
      
      <div class="key-group">
        <div class="key-input-box">
          <label>1. Architect (Initial Draft)</label>
          <input type="password" id="key1" placeholder="Paste your API Key here" />
        </div>
        <div class="key-input-box">
          <label>2. Critic (Find Bugs & Flaws)</label>
          <input type="password" id="key2" placeholder="Gemini API Key 2" />
        </div>
        <div class="key-input-box">
          <label>3. Fixer (Refine & Resolve Issues)</label>
          <input type="password" id="key3" placeholder="Gemini API Key 3" />
        </div>
        <div class="key-input-box">
          <label>4. Enhancer (Add Advanced Features)</label>
          <input type="password" id="key4" placeholder="Gemini API Key 4" />
        </div>
        <div class="key-input-box">
          <label>5. Polisher (Final Master Output)</label>
          <input type="password" id="key5" placeholder="Gemini API Key 5" />
        </div>
      </div>
    </details>

    <div id="chat-container"></div>
  </div>

  <div class="input-bar">
    <textarea id="taskInput" placeholder="Enter task (e.g., 'Build a Python calculator')..."></textarea>
    <button class="send-btn" id="runBtn" type="button">Send</button>
  </div>

  <script>
    // Configure Marked.js for secure, formatted Markdown rendering
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    const AGENTS = [
      { id: 1, name: "Stage 1: Architect", prompt: "You are Stage 1. Create a complete first draft or solution for this task. Ensure your response is formatted in Markdown." },
      { id: 2, name: "Stage 2: Critical Auditor", prompt: "You are Stage 2. Critically evaluate this draft for bugs, errors, edge cases, and missing features. Re-write it in Markdown to fix every issue:" },
      { id: 3, name: "Stage 3: Logic Fixer", prompt: "You are Stage 3. Optimize the structure, fix remaining issues, and ensure extreme accuracy. Use Markdown:" },
      { id: 4, name: "Stage 4: Feature Enhancer", prompt: "You are Stage 4. Polish the UX, formatting, and completeness. Make it production-grade in Markdown:" },
      { id: 5, name: "Stage 5: Master Synthesis", prompt: "You are Stage 5 (Final Polish). Provide the absolute final, flawless version. Trim meta-talk and output ONLY the master product formatted beautifully in Markdown:" }
    ];

    document.getElementById('duplicateBtn').addEventListener('click', function() {
      const k1 = document.getElementById('key1').value.trim();
      if (!k1) {
        alert("Please enter a key in slot #1 first!");
        return;
      }
      for (let i = 2; i <= 5; i++) {
        document.getElementById(`key${i}`).value = k1;
      }
      alert("Key #1 successfully copied to all slots!");
    });

    document.getElementById('runBtn').addEventListener('click', startPipeline);

    async function callGemini(apiKey, systemInstruction, inputContent) {
      // Correctly pointing to gemini-3.5-flash as requested
      const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent";
      
      const payload = {
        contents: [{
          parts: [{ text: `${systemInstruction}\n\n--- INPUT DATA ---\n${inputContent}` }]
        }]
      };

      const res = await fetch(url, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey 
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        const errMsg = errData?.error?.message || "Ensure your API Key is valid and has quota.";
        throw new Error(`API Error: ${errMsg}`);
      }
      
      const data = await res.json();
      
      // Added safety check here to prevent crashes if the API returns a blocked/empty response
      if (!data.candidates || data.candidates.length === 0) {
        throw new Error("API returned an empty response. This is usually caused by safety filter blocks.");
      }
      
      return data.candidates[0].content.parts[0].text;
    }

    function createMsgCard(title, text, styleClass = '') {
      const container = document.getElementById("chat-container");
      const card = document.createElement("div");
      card.className = `msg-card ${styleClass}`;
      
      card.innerHTML = `
        <h4>${title}</h4>
        <button class="copy-btn" type="button">📋 Copy text</button>
        <div class="markdown-body"></div>
      `;

      container.appendChild(card);
      scrollToBottom();

      card.dataset.rawText = text;
      
      const bodyDiv = card.querySelector('.markdown-body');
      if (title.includes("⏳ Thinking")) {
        bodyDiv.innerHTML = `<span class="spinner"></span>${text}`;
      } else {
        // Safe HTML injection
        bodyDiv.innerHTML = DOMPurify.sanitize(marked.parse(text), { ADD_ATTR: ['class'] });
      }

      card.querySelector('.copy-btn').addEventListener('click', function() {
        navigator.clipboard.writeText(card.dataset.rawText).then(() => {
          const btn = this;
          const originalText = btn.innerHTML;
          btn.innerHTML = "✅ Copied!";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.remove("copied");
          }, 2000);
        }).catch(err => alert("Failed to copy: " + err));
      });

      return card;
    }

    function updateMsgCard(card, newText, isFinal = false) {
      card.dataset.rawText = newText;
      const bodyDiv = card.querySelector('.markdown-body');
      
      // Ensure syntax highlighting classes survive sanitization
      bodyDiv.innerHTML = DOMPurify.sanitize(marked.parse(newText), { ADD_ATTR: ['class'] });
      
      if (isFinal) {
        card.classList.add("final");
      }
      
      card.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });
      
      scrollToBottom();
    }

    function scrollToBottom() {
      const scrollArea = document.getElementById('main-scroll-area');
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    async function startPipeline() {
      const taskText = document.getElementById("taskInput").value.trim();
      if (!taskText) {
        alert("Please type a task first!");
        return;
      }

      const keys = [
        document.getElementById("key1").value.trim(),
        document.getElementById("key2").value.trim(),
        document.getElementById("key3").value.trim(),
        document.getElementById("key4").value.trim(),
        document.getElementById("key5").value.trim()
      ];

      if (!keys[0]) {
        alert("Please enter at least Key #1!");
        return;
      }

      document.getElementById("settings-panel").open = false;
      const runBtn = document.getElementById("runBtn");
      runBtn.disabled = true;
      document.getElementById("taskInput").value = "";

      createMsgCard("👤 Your Task", taskText);

      let currentPass = taskText;

      try {
        for (let i = 0; i < 5; i++) {
          const agent = AGENTS[i];
          const apiKey = keys[i] || keys[0]; 
          
          const statusCard = createMsgCard(agent.name, "Processing generation...", "");
          
          const result = await callGemini(apiKey, agent.prompt, currentPass);
          
          updateMsgCard(statusCard, result, i === 4);
          currentPass = result; 
        }
      } catch (err) {
        createMsgCard("⚠️ Pipeline Error", err.message, "error");
      } finally {
        runBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
